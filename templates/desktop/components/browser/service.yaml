# Chromium's DevTools (CDP) for the project's dev pod: http://<project>-desktop-cdp.<namespace>.svc:9223.
# Its ClusterIP stays put while the desktop is scaled to zero; requests then fail to connect.
apiVersion: v1
kind: Service
metadata:
  name: desktop-cdp
spec:
  selector: {app.kubernetes.io/name: desktop}
  ports:
    - {name: cdp, port: 9223, targetPort: cdp, protocol: TCP}
