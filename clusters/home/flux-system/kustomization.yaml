apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
# Components: the default four plus image-reflector-controller and image-automation-controller,
# for rolling out CI-built images. Regenerate with
#   flux install --export --version=v2.10.0 \
#     --components-extra=image-reflector-controller,image-automation-controller \
#     > clusters/home/flux-system/gotk-components.yaml
#
# Flux gives its other controllers system-cluster-critical but leaves these without a class
# (priority 0, below batch). Flux's documented way to customise its components is a patch here.
patches:
  - target: {kind: Deployment, name: (notification|image-reflector|image-automation)-controller}
    patch: |
      - op: add
        path: /spec/template/spec/priorityClassName
        value: system-cluster-critical
