# Flux syncs itself and everything under clusters/home from the homelab repo on Forgejo.
# Written by hand (the "flux install" + sync manifest route) because flux bootstrap gitea needs an
# HTTPS API and a personal access token; Forgejo here is plain HTTP on the LAN.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: flux-system          # read-only deploy key "flux-bc250", generated in-cluster
  url: ssh://git@192.168.1.106:30022/nitpreet22/homelab.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/home
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
