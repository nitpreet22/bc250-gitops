# Forgejo: the cluster's git server (decided 2026-10-27: self-hosted now, GitHub mirror later).
# Flux pulls the homelab repo from here, dev pods clone project repos from here, and promotion
# PRs happen here.
#
# Installed by bootstrap/03-forgejo.sh into k3s's auto-deploy folder on the server
# (/var/lib/rancher/k3s/server/manifests/), so it is part of the k3s bootstrap and does not
# depend on Flux, which itself depends on it.
#
# Access:
#   PC / LAN   http://bc250-2:30300   ssh://git@bc250-2:30022/<owner>/<repo>.git
#   in-cluster http://forgejo-http.forgejo.svc:3000   ssh://git@forgejo-ssh.forgejo.svc:22
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: forgejo
  namespace: kube-system
spec:
  chart: oci://code.forgejo.org/forgejo-helm/forgejo
  version: 17.3.2               # Forgejo 15.0.11
  targetNamespace: forgejo
  valuesContent: |-
    nodeSelector:
      role: brain
    priorityClassName: platform   # infrastructure/priority-classes.yaml (Phase 3)
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {memory: 512Mi}
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
    service:
      http:
        type: NodePort
        port: 3000
        nodePort: 30300
      ssh:
        type: NodePort
        port: 22
        nodePort: 30022
    gitea:
      admin:
        # Created by bootstrap/03-forgejo.sh with a random password that never leaves the cluster.
        existingSecret: forgejo-admin
        email: admin@homelab.lan
        passwordMode: initialOnlyNoReset
      config:
        APP_NAME: homelab git
        server:
          DOMAIN: bc250-2
          ROOT_URL: http://bc250-2:30300/
          SSH_DOMAIN: bc250-2
          SSH_PORT: 30022           # advertised in clone URLs (the NodePort)
          SSH_LISTEN_PORT: 2222     # rootless image listens here
        database:
          DB_TYPE: sqlite3          # one user, a few dozen repos: no separate database needed
        service:
          DISABLE_REGISTRATION: true
        repository:
          DEFAULT_PRIVATE: private
