# Read-only access for the dashboard's Cluster view (13_home_server_dashboard, internal/cluster).
# get/list only, no Secrets, no write verbs. Controls (scaling, backups)
# will get their own, narrower ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-hub-read
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-hub-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-hub-read
subjects:
  - kind: ServiceAccount
    name: homelab-hub
    namespace: ops
