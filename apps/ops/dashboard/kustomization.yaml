# The running ops dashboard: homelab-hub from 13_home_server_dashboard (Phase 6 plan, approved
# 2026-10-28). The per-board homelab-agents stay host services outside Flux.
#
# The shared agent token is Secret homelab-agent-token, created by bootstrap/rotate-agent-token.sh
# (not in Git). Open it on the LAN at http://192.168.1.106:30880.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ops
labels:
  - pairs:
      homelab.lan/project: home-server-dashboard
      homelab.lan/component: dashboard
      homelab.lan/tier: service
    includeSelectors: false
    includeTemplates: true
resources:
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - tailscale-ingress.yaml
configMapGenerator:
  - name: homelab-hub-config
    files: [hub.json]
