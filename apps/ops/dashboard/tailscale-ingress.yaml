# Private HTTPS name for the ops dashboard hub on your tailnet: https://homelab.<tailnet>.ts.net (Tailscale
# operator, infrastructure/optional/tailscale). Only devices on the tailnet can reach it; the
# operator's proxy pod forwards to the Service, and network-policy.yaml admits only that proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelab-hub-tailnet
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: homelab-hub
      port: {name: http}
  tls:
    - hosts: [homelab]
