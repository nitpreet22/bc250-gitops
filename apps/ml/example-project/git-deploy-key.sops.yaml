# (the rules are in .sops.yaml).
apiVersion: v1
kind: Secret
metadata:
    name: git-deploy-key # the overlay's namePrefix makes this <project>-git-deploy-key
    namespace: ml
type: kubernetes.io/ssh-auth
stringData:
    ssh-privatekey: REPLACE_ME
