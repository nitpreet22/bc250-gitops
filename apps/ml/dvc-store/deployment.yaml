apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  replicas: 1
  strategy: {type: Recreate}      # the volume is ReadWriteOnce
  selector:
    matchLabels: {app.kubernetes.io/name: dvc-store}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dvc-store}
    spec:
      priorityClassName: agent
      nodeSelector: {role: brain}
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: garage
          image: registry.homelab.lan/garage:2026-10-29.1
          env:
            - {name: S3_BUCKET, value: dvc}
            - {name: GARAGE_CAPACITY, value: 90G}
            - name: GARAGE_RPC_SECRET
              valueFrom: {secretKeyRef: {name: garage, key: rpc_secret}}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: garage, key: admin_token}}
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-dvc, key: access_key_id}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-dvc, key: secret_access_key}}
          ports:
            - {name: s3, containerPort: 3900, hostPort: 3900, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/garage}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
