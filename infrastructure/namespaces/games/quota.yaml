# Sized from the plan's memory budget; revisit after the Phase 8 load test.
# No GPU line: GPU pods here queue at the scheduler (the device plugin offers exactly one GPU)
# instead of being rejected by the quota. Namespaces without GPU work have a GPU quota of 0.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 11Gi
    limits.cpu: "18"
    limits.memory: 18Gi
    pods: "15"
