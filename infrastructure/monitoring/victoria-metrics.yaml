apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      version: 0.50.0           # VictoriaMetrics v1.155.0
      sourceRef: {kind: HelmRepository, name: victoriametrics, namespace: flux-system}
  values:
    server:
      fullnameOverride: vmsingle
      retentionPeriod: 30d
      nodeSelector: {role: brain}
      priorityClassName: platform
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: 10Gi
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 768Mi}
      scrape:
        enabled: true           # the chart's default jobs: API server, kubelets, cAdvisor, annotated services and pods
