apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.7.1            # kube-state-metrics 2.20.0
      sourceRef: {kind: HelmRepository, name: prometheus-community, namespace: flux-system}
  values:
    fullnameOverride: kube-state-metrics
    nodeSelector: {role: brain}
    priorityClassName: platform
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    prometheusScrape: true      # adds prometheus.io/scrape to the Service
    service:
      annotations:
        prometheus.io/port: "8080"   # VictoriaMetrics' default job keeps a target only with this
