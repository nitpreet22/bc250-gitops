apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef: {kind: HelmRepository, name: tailscale, namespace: flux-system}
  values:
    # The chart reads the OAuth client from the operator-oauth Secret in this namespace.
    operatorConfig:
      hostname: bc250-operator
      nodeSelector: {role: brain}
      priorityClassName: platform   # remote access is how you reach everything else
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
    # Proxies for the apps' tailnet names (their tailscale-ingress.yaml) use ProxyClass homelab
    # (apps/tailscale): priority class, like every long-running pod.
    proxyConfig:
      defaultProxyClass: homelab
    apiServerProxyConfig:
      mode: "true"              # kubectl over the tailnet, authenticated by your Tailscale identity
